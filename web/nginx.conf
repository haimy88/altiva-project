server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS. Using a variable makes nginx re-resolve "api" (every 10s) instead of caching the IP from startup,
    # so recreating the api container doesn't break the proxy.
    resolver 127.0.0.11 valid=10s;

    # Same origin for the UI and the API: no CORS needed in Docker.
    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Client-side routes (/jobs/..., /history) all serve index.html; React Router takes it from there.
    location / {
        try_files $uri /index.html;
    }
}
