# Local stack: Postgres + RabbitMQ + Crawl API (Service A) + Crawl Worker (Service B) + React UI.
# Dev-only credentials (crawler/crawler) — not for production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crawler
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d crawler"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: crawler
      RABBITMQ_DEFAULT_PASS: crawler
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies SQL migrations, then exits. api + worker start only after it succeeds.
  migrate:
    image: crawler-api
    build: { context: ., args: { PROJECT: Crawler.Api } }
    command: ["--migrate"]
    environment: &app-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=crawler;Username=crawler;Password=crawler;GSS Encryption Mode=Disable
      RabbitMq__Host: rabbitmq
      RabbitMq__User: crawler
      RabbitMq__Password: crawler
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: crawler-api
    build: { context: ., args: { PROJECT: Crawler.Api } }
    environment: *app-env
    ports: ["5080:8080"]
    depends_on: &app-deps
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    image: crawler-worker
    build: { context: ., args: { PROJECT: Crawler.Worker } }
    environment:
      <<: *app-env
      # Message retry attempts for transient failures (override: WORKER_MAX_ATTEMPTS=2 docker compose up -d worker)
      Messaging__Retry__MaxAttempts: ${WORKER_MAX_ATTEMPTS:-5}
    ports: ["5081:8080"]
    depends_on: *app-deps

  # React UI served by nginx, which also proxies /api → api. Open http://localhost:8080
  web:
    image: crawler-web
    build: { context: ./web }
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
